<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Secure - تطبيق المراسلة المشفرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Readex Pro', 'Plus Jakarta Sans', sans-serif;
            background: #0b0f19;
            color: #f3f4f6;
        }

        /* خلفية زجاجية مشوشة */
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* توهج النيون للأزرار */
        .btn-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }

        /* أنيميشن ناعم لفقاعات الرسائل */
        .message-pop {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex items-center justify-center p-0 md:p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-purple-950 to-slate-950">

    <!-- 1. شاشة تسجيل الدخول المبتكرة -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-xl">
        <div class="glass-panel rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative overflow-hidden border border-white/10">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>

            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-3xl flex items-center justify-center text-white text-3xl mx-auto mb-6 shadow-lg btn-glow rotate-3 hover:rotate-0 transition duration-300">
                <i class="fas fa-shield-halved"></i>
            </div>
            
            <h2 class="text-3xl font-extrabold text-white mb-2 tracking-wide">Ping Secure</h2>
            <p class="text-gray-400 mb-8 text-sm leading-relaxed">تواصل خاص ومستقبل مشفر بتشفير تام (E2EE) بدون تنازلات عن الخصوصية</p>
            
            <button id="loginBtn" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 px-6 rounded-2xl transition duration-300 flex items-center justify-center gap-3 btn-glow group">
                <i class="fab fa-google text-xl group-hover:scale-110 transition duration-300"></i>
                <span class="text-base">تسجيل الدخول الآمن بواسطة Google</span>
            </button>
        </div>
    </div>

    <!-- 2. واجهة التطبيق الرئيسية (شاشة المحادثات) -->
    <div id="mainApp" class="hidden w-full h-full max-w-7xl h-[100vh] md:h-[95vh] glass-panel md:rounded-3xl shadow-2xl flex overflow-hidden border border-white/10">
        
        <!-- القائمة الجانبية (المستخدمين) -->
        <div class="w-full md:w-80 lg:w-96 border-l border-white/10 flex flex-col h-full bg-slate-900/60 backdrop-blur-md">
            <!-- الهيدر الشخصي -->
            <div class="p-4 border-b border-white/10 flex items-center justify-between bg-white/5">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img id="myAvatar" class="w-11 h-11 rounded-2xl object-cover ring-2 ring-blue-500/50 shadow-md" src="https://via.placeholder.com/40" alt="صورة المستخدم">
                        <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                    </div>
                    <div>
                        <h1 id="myName" class="font-bold text-sm text-white truncate max-w-[140px]">جاري التحميل...</h1>
                        <span class="text-[11px] text-emerald-400 font-medium flex items-center gap-1">
                            <i class="fas fa-lock text-[9px]"></i> مشفر وآمن
                        </span>
                    </div>
                </div>
                <button id="logoutBtn" title="تسجيل الخروج" class="w-9 h-9 rounded-xl bg-white/5 hover:bg-rose-500/20 text-gray-400 hover:text-rose-400 transition duration-200 flex items-center justify-center">
                    <i class="fas fa-arrow-right-from-bracket"></i>
                </button>
            </div>

            <!-- عنوان قائمة المستخدمين -->
            <div class="px-5 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wider flex items-center justify-between">
                <span>جهات الاتصال المتاحة</span>
                <span class="bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full text-[10px]">E2EE</span>
            </div>

            <!-- قائمة المستخدمين -->
            <div id="usersList" class="flex-1 overflow-y-auto px-2 space-y-1">
                <!-- ملء القائمة ديناميكياً -->
            </div>
        </div>

        <!-- منطقة المحادثة الرئيسية -->
        <div class="hidden md:flex flex-1 flex-col h-full bg-slate-950/40 relative">
            
            <!-- هيدر المحادثة النشطة -->
            <div id="chatHeader" class="p-4 border-b border-white/10 bg-slate-900/40 backdrop-blur-md flex items-center gap-3 shadow-sm z-10">
                <div class="w-11 h-11 bg-white/5 rounded-2xl flex items-center justify-center text-blue-400 font-bold border border-white/10">
                    <i class="fas fa-comments text-lg"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white text-sm">اختر جهة اتصال للبدء</h2>
                    <p class="text-xs text-gray-400">جميع المحادثات تشفر وتفك محلياً فقط</p>
                </div>
            </div>

            <!-- شاشة عرض الرسائل (dir="ltr" لضبط ترتيب واتساب) -->
            <div id="chatMessages" dir="ltr" class="flex-1 p-4 md:p-6 overflow-y-auto space-y-4">
                <div class="flex flex-col h-full items-center justify-center text-gray-500 text-sm gap-3">
                    <div class="w-16 h-16 rounded-3xl bg-white/5 flex items-center justify-center text-2xl text-blue-500/50">
                        <i class="fas fa-shield-cat"></i>
                    </div>
                    <p>اختر شخصاً من القائمة لبدء المحادثة المشفرة 🔐</p>
                </div>
            </div>

            <!-- حقل كتابة المرفقات وإرسال الرسائل -->
            <div id="inputContainer" class="p-4 bg-slate-900/60 backdrop-blur-md border-t border-white/10 hidden">
                <div class="flex items-center gap-3 max-w-5xl mx-auto">
                    <!-- زر رفع الصور -->
                    <label for="imageInput" id="uploadLabel" class="cursor-pointer bg-white/5 hover:bg-white/10 text-blue-400 hover:text-blue-300 w-12 h-12 rounded-2xl transition duration-200 flex items-center justify-center border border-white/10 shrink-0" title="إرفاق صورة مشفرة">
                        <i class="fas fa-paperclip text-lg" id="uploadIcon"></i>
                    </label>
                    <input type="file" id="imageInput" accept="image/*" class="hidden">

                    <!-- حقل إدخال النص -->
                    <div class="flex-1 relative">
                        <input id="messageInput" type="text" placeholder="اكتب رسالة مشفرة..." class="w-full bg-slate-900/90 text-white placeholder-gray-500 rounded-2xl px-5 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 border border-white/10 transition duration-200">
                    </div>
                    
                    <!-- زر الإرسال -->
                    <button id="sendBtn" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white w-12 h-12 rounded-2xl transition duration-200 flex items-center justify-center shrink-0 btn-glow">
                        <i class="fas fa-paper-plane text-base -rotate-45 translate-x-0.5"></i>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- البرمجة السحابية والتشفير -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // مفتاح ImgBB المجاني الخاص بك
        const IMGBB_API_KEY = "d0e78a427404c26f247b3e644e8b3cbe";

        const firebaseConfig = {
            apiKey: "AIzaSyDsdSew4trEXkeKnecguN2uZWIq9XtNGhI",
            authDomain: "ping-b3ff7.firebaseapp.com",
            projectId: "ping-b3ff7",
            storageBucket: "ping-b3ff7.firebasestorage.app",
            messagingSenderId: "234007505458",
            appId: "1:234007505458:web:ddf24a6e8d590d78db6a2b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const myAvatar = document.getElementById('myAvatar');
        const myName = document.getElementById('myName');
        const usersList = document.getElementById('usersList');
        const chatHeader = document.getElementById('chatHeader');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const inputContainer = document.getElementById('inputContainer');
        const imageInput = document.getElementById('imageInput');
        const uploadIcon = document.getElementById('uploadIcon');

        let currentUser = null;
        let selectedUser = null;
        let currentChatId = null;
        let secretEncryptionKey = null;
        let unsubscribeMessages = null;

        function encryptData(text, key) {
            if (!text) return "";
            return CryptoJS.AES.encrypt(text, key).toString();
        }

        function decryptData(ciphertext, key) {
            if (!ciphertext) return "";
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, key);
                return bytes.toString(CryptoJS.enc.Utf8);
            } catch (e) {
                return "[خطأ في فك التشفير]";
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                myAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
                myName.textContent = user.displayName;

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL,
                    lastSeen: serverTimestamp()
                }, { merge: true });

                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');

                loadUsers();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
        logoutBtn.addEventListener('click', () => signOut(auth));

        function loadUsers() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                usersList.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const userData = docSnap.data();
                    if (userData.uid === currentUser.uid) return;

                    const userEl = document.createElement('div');
                    userEl.className = "p-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 cursor-pointer transition duration-200 border border-transparent hover:border-white/5 my-1";
                    userEl.innerHTML = `
                        <div class="relative">
                            <img src="${userData.photoURL || 'https://via.placeholder.com/40'}" class="w-12 h-12 rounded-2xl object-cover">
                            <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-sm text-white truncate">${userData.name}</h3>
                            <p class="text-xs text-gray-400 truncate">${userData.email}</p>
                        </div>
                    `;

                    userEl.addEventListener('click', () => openChat(userData));
                    usersList.appendChild(userEl);
                });
            });
        }

        function openChat(targetUser) {
            selectedUser = targetUser;
            inputContainer.classList.remove('hidden');
            
            currentChatId = [currentUser.uid, targetUser.uid].sort().join("_");
            secretEncryptionKey = `PingSecret_${currentChatId}_2026`;

            chatHeader.innerHTML = `
                <div class="relative">
                    <img src="${targetUser.photoURL}" class="w-11 h-11 rounded-2xl object-cover ring-2 ring-blue-500/30">
                </div>
                <div>
                    <h2 class="font-bold text-white text-sm">${targetUser.name}</h2>
                    <p class="text-xs text-emerald-400 font-medium flex items-center gap-1">
                        <i class="fas fa-shield-halved text-[10px]"></i> محادثة خاصة مشفرة (E2EE)
                    </p>
                </div>
            `;

            loadMessages();
        }

        async function sendMessage(encryptedImageUrl = null) {
            const text = messageInput.value.trim();
            if (!text && !encryptedImageUrl) return;

            messageInput.value = '';

            const encryptedText = text ? encryptData(text, secretEncryptionKey) : "";

            await addDoc(collection(db, "chats", currentChatId, "messages"), {
                senderUid: currentUser.uid,
                text: encryptedText,
                imageUrl: encryptedImageUrl || "",
                timestamp: serverTimestamp()
            });
        }

        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatId) return;

            uploadIcon.className = "fas fa-spinner fa-spin text-lg text-blue-400";

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    const encryptedUrl = encryptData(result.data.url, secretEncryptionKey);
                    await sendMessage(encryptedUrl);
                } else {
                    alert("تعذر رفع الصورة. حاول مرة أخرى.");
                }
            } catch (error) {
                console.error("خطأ:", error);
            } finally {
                uploadIcon.className = "fas fa-paperclip text-lg";
                imageInput.value = '';
            }
        });

        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(
                collection(db, "chats", currentChatId, "messages"),
                orderBy("timestamp", "asc")
            );

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMine = msg.senderUid === currentUser.uid;

                    const decryptedText = msg.text ? decryptData(msg.text, secretEncryptionKey) : "";
                    const decryptedImageUrl = msg.imageUrl ? decryptData(msg.imageUrl, secretEncryptionKey) : "";

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex w-full ${isMine ? 'justify-end' : 'justify-start'} message-pop`;
                    
                    let content = '';
                    if (decryptedImageUrl) {
                        content += `<img src="${decryptedImageUrl}" class="rounded-xl max-w-xs mb-2 max-h-60 object-cover cursor-pointer hover:opacity-90 transition border border-white/10 shadow-md" onclick="window.open('${decryptedImageUrl}', '_blank')">`;
                    }
                    if (decryptedText) {
                        content += `<p class="text-sm leading-relaxed">${decryptedText}</p>`;
                    }

                    msgDiv.innerHTML = `
                        <div dir="rtl" class="${isMine ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl rounded-br-xs shadow-lg' : 'bg-slate-800/80 text-gray-100 border border-white/10 rounded-2xl rounded-bl-xs backdrop-blur-md'} max-w-xs md:max-w-md p-3.5 shadow-md">
                            ${content}
                        </div>
                    `;
                    chatMessages.appendChild(msgDiv);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        sendBtn.addEventListener('click', () => sendMessage());
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
