<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Ping Secure - Instagram Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap');
        
        html, body { 
            font-family: 'Readex Pro', 'Plus Jakarta Sans', sans-serif;
            background: #000000;
            color: #f3f4f6;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
            user-select: none;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        .ig-panel {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        .ig-gradient-btn {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .message-pop {
            animation: popIn 0.2s ease-out forwards;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.96) translateY(6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex items-center justify-center p-0 md:p-4 bg-black">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
        <div class="ig-panel rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative border border-white/10">
            <div class="w-20 h-20 ig-gradient-btn rounded-3xl flex items-center justify-center text-white text-3xl mx-auto mb-6 shadow-xl">
                <i class="fab fa-instagram"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Ping Direct</h2>
            <p class="text-gray-400 mb-8 text-sm">محادثات خاصة بتصميم انستغرام وتشفير تام (E2EE)</p>
            <button id="loginBtn" class="w-full ig-gradient-btn text-white font-bold py-3.5 px-6 rounded-2xl transition duration-300 flex items-center justify-center gap-3 shadow-lg hover:opacity-95">
                <i class="fab fa-google text-xl"></i>
                <span class="text-base">تسجيل الدخول بواسطة Google</span>
            </button>
        </div>
    </div>

    <!-- 2. نافذة تعديل البروفايل -->
    <div id="profileModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl">
        <div class="ig-panel rounded-3xl p-6 max-w-md w-full shadow-2xl border border-white/10">
            <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-3">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fas fa-sliders text-pink-500"></i> تعديل الملف الشخصي
                </h3>
                <button id="closeProfileBtn" class="text-gray-400 hover:text-white"><i class="fas fa-times text-lg"></i></button>
            </div>

            <div class="space-y-4">
                <div class="flex flex-col items-center justify-center mb-2">
                    <div class="relative group cursor-pointer" id="avatarUploadContainer">
                        <img id="editAvatarPreview" class="w-20 h-20 rounded-full object-cover p-1 bg-gradient-to-tr from-yellow-400 via-rose-500 to-purple-600 shadow-xl" src="https://via.placeholder.com/80">
                        <div class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-200">
                            <i class="fas fa-camera text-white text-xl"></i>
                        </div>
                    </div>
                    <label for="profileAvatarInput" class="mt-2 text-xs font-semibold text-pink-400 hover:text-pink-300 cursor-pointer flex items-center gap-1">
                        تغيير صورة البروفايل
                    </label>
                    <input type="file" id="profileAvatarInput" accept="image/*" class="hidden">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">الاسم</label>
                    <input id="editDisplayName" type="text" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">اسم المستخدم (@username)</label>
                    <div class="flex items-center bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5">
                        <span class="text-gray-500 text-sm ml-1">@</span>
                        <input id="editUsername" type="text" placeholder="username" class="w-full bg-transparent text-sm text-white focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">السيرة الذاتية (Bio)</label>
                    <input id="editBio" type="text" placeholder="Ping Direct..." class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>

                <button id="saveProfileBtn" class="w-full ig-gradient-btn text-white font-bold py-3 rounded-xl transition mt-4 flex items-center justify-center gap-2 shadow-md">
                    <span id="saveProfileBtnText">تم</span>
                    <i id="saveProfileSpinner" class="fas fa-spinner fa-spin hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 3. نافذة طلبات المحادثة -->
    <div id="requestsModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl">
        <div class="ig-panel rounded-3xl p-6 max-w-md w-full shadow-2xl border border-white/10">
            <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fas fa-envelope-open text-amber-400"></i> طلبات المراسلة
                </h3>
                <button id="closeRequestsBtn" class="text-gray-400 hover:text-white"><i class="fas fa-times text-lg"></i></button>
            </div>
            <div id="requestsListContainer" class="space-y-3 max-h-60 overflow-y-auto my-4">
                <!-- قائمة الطلبات -->
            </div>
        </div>
    </div>

    <!-- 4. نافذة إرسال رسالة/إضافة جديدة -->
    <div id="addUserModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl">
        <div class="ig-panel rounded-3xl p-6 max-w-md w-full shadow-2xl border border-white/10">
            <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fas fa-paper-plane text-pink-500"></i> رسالة جديدة
                </h3>
                <button id="closeAddUserBtn" class="text-gray-400 hover:text-white"><i class="fas fa-times text-lg"></i></button>
            </div>
            <p class="text-xs text-gray-400 mb-4">ابحث برمز المستخدم (@username) لبدء المحادثة:</p>
            <div class="flex items-center bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 mb-4">
                <span class="text-gray-500 text-sm ml-1">@</span>
                <input id="searchUsernameInput" type="text" placeholder="بحث..." class="w-full bg-transparent text-sm text-white focus:outline-none">
            </div>
            <button id="sendFriendRequestBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">
                إرسال طلب دردشة
            </button>
        </div>
    </div>

    <!-- 5. عارض صور المشاهدة لمرة واحدة (View Once Viewer) -->
    <div id="viewOnceModal" class="fixed inset-0 z-50 hidden flex flex-col items-center justify-center p-4 bg-black/95 backdrop-blur-2xl">
        <div class="absolute top-4 right-4 text-white text-xs bg-slate-800 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-white/10">
            <i class="fas fa-bomb text-rose-500"></i> صورة للعرض مرة واحدة
        </div>
        <img id="viewOnceImg" class="max-w-full max-h-[80vh] rounded-2xl object-contain shadow-2xl mb-6">
        <button id="closeViewOnceBtn" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-2xl transition shadow-lg">
            إغلاق وحذف الصورة
        </button>
    </div>

    <!-- 6. واجهة التطبيق الرئيسية (Direct Messages View) -->
    <div id="mainApp" class="hidden w-full h-full max-w-7xl h-[100vh] md:h-[95vh] bg-black md:rounded-3xl shadow-2xl flex overflow-hidden border border-white/10">
        
        <!-- القائمة الجانبية (قائمة الرسائل) -->
        <div id="sidebarPanel" class="w-full md:w-80 lg:w-96 border-l border-white/10 flex flex-col h-full bg-black">
            
            <div class="p-4 border-b border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" id="openProfileBtn">
                    <div class="relative">
                        <img id="myAvatar" class="w-10 h-10 rounded-full object-cover p-0.5 bg-gradient-to-tr from-yellow-400 to-purple-600">
                    </div>
                    <div>
                        <h1 id="myUserHandle" class="font-bold text-sm text-white font-mono truncate max-w-[120px]">@username</h1>
                        <p id="myName" class="text-[11px] text-gray-400 truncate">البروفايل</p>
                    </div>
                </div>

                <div class="flex items-center gap-1">
                    <button id="openRequestsBtn" title="طلبات المراسلة" class="relative w-9 h-9 rounded-full hover:bg-white/10 text-gray-300 transition flex items-center justify-center">
                        <i class="far fa-paper-plane text-base"></i>
                        <span id="requestsBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
                    </button>
                    <button id="copyInviteBtn" title="رابط الدعوة" class="w-9 h-9 rounded-full hover:bg-white/10 text-gray-300 transition flex items-center justify-center">
                        <i class="fas fa-link text-base"></i>
                    </button>
                    <button id="logoutBtn" title="خروج" class="w-9 h-9 rounded-full hover:bg-rose-500/20 text-gray-400 hover:text-rose-400 transition flex items-center justify-center">
                        <i class="fas fa-arrow-right-from-bracket text-base"></i>
                    </button>
                </div>
            </div>

            <div class="p-3 border-b border-white/5">
                <button id="openAddUserModalBtn" class="w-full bg-white/10 hover:bg-white/15 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fas fa-pen-to-square text-pink-500"></i> إرسال رسالة جديدة
                </button>
            </div>

            <div class="px-5 py-3 text-xs font-bold text-gray-400 uppercase tracking-wider flex items-center justify-between">
                <span>الرسائل (Direct)</span>
            </div>

            <div id="usersList" class="flex-1 overflow-y-auto px-2 space-y-1">
                <!-- قائمة الأصدقاء -->
            </div>
        </div>

        <!-- منطقة المحادثة المباشرة (Instagram DM Chat Screen) -->
        <div id="chatPanel" class="hidden md:flex flex-1 flex-col h-full bg-black relative">
            
            <!-- هيدر المحادثة بالأسلوب الدقيق لـ Instagram -->
            <div id="chatHeader" class="p-3 border-b border-white/10 bg-black flex items-center justify-between shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <button id="backToUsersBtn" class="md:hidden w-8 h-8 rounded-full hover:bg-white/10 text-white flex items-center justify-center transition" title="رجوع">
                        <i class="fas fa-chevron-right text-lg"></i>
                    </button>

                    <div id="chatHeaderAvatarContainer" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400">
                        <i class="far fa-user-circle text-2xl"></i>
                    </div>
                    <div>
                        <h2 id="chatHeaderName" class="font-bold text-white text-sm">اختر محادثة</h2>
                        <p id="chatHeaderBio" class="text-[11px] text-gray-400">نشط الآن</p>
                    </div>
                </div>

                <div id="chatHeaderMenu" class="hidden flex items-center gap-2">
                    <button id="blockUserBtn" class="text-xs text-rose-500 hover:bg-rose-500/10 px-3 py-1.5 rounded-full border border-rose-500/20 transition flex items-center gap-1">
                        <i class="fas fa-ban"></i> حظر
                    </button>
                </div>
            </div>

            <!-- شاشة عرض الرسائل بتصميم انستغرام -->
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-black">
                <div class="flex flex-col h-full items-center justify-center text-gray-500 text-sm gap-3">
                    <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center text-2xl text-pink-500">
                        <i class="fab fa-instagram text-3xl"></i>
                    </div>
                    <p>اختر جهة اتصال لبدء الدردشة الفورية 🔐</p>
                </div>
            </div>

            <!-- شريط الأدوات وإدخال الرسائل (Instagram DM Input Bar) -->
            <div id="inputContainer" class="p-3 bg-black border-t border-white/10 hidden">
                <div class="flex items-center gap-2 max-w-5xl mx-auto bg-slate-900/90 border border-white/15 rounded-full px-3 py-1.5">
                    
                    <!-- صورة للعرض مرة واحدة camera icon -->
                    <label for="viewOnceInput" class="cursor-pointer text-pink-500 hover:text-pink-400 p-2 rounded-full transition flex items-center justify-center" title="صورة للعرض مرة واحدة">
                        <i class="fas fa-camera text-lg"></i>
                    </label>
                    <input type="file" id="viewOnceInput" accept="image/*" class="hidden">

                    <!-- صورة عادية gallery icon -->
                    <label for="imageInput" id="uploadLabel" class="cursor-pointer text-gray-400 hover:text-white p-2 rounded-full transition flex items-center justify-center" title="إرفاق صورة">
                        <i class="far fa-image text-lg" id="uploadIcon"></i>
                    </label>
                    <input type="file" id="imageInput" accept="image/*" class="hidden">

                    <!-- تسجيل صوت mic icon -->
                    <button id="recordAudioBtn" class="text-gray-400 hover:text-rose-400 p-2 rounded-full transition flex items-center justify-center" title="تسجيل صوت">
                        <i class="fas fa-microphone text-lg" id="recordIcon"></i>
                    </button>

                    <!-- حقل إدخال الرسالة النصية -->
                    <input id="messageInput" type="text" placeholder="اكتب رسالة..." class="flex-1 bg-transparent text-white placeholder-gray-500 text-sm focus:outline-none px-2">
                    
                    <!-- زر الإرسال -->
                    <button id="sendBtn" class="text-blue-500 hover:text-blue-400 font-bold text-sm px-3 py-1 rounded-full transition">
                        إرسال
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const IMGBB_API_KEY = "d0e78a427404c26f247b3e644e8b3cbe";

        const firebaseConfig = {
            apiKey: "AIzaSyDsdSew4trEXkeKnecguN2uZWIq9XtNGhI",
            authDomain: "ping-b3ff7.firebaseapp.com",
            projectId: "ping-b3ff7",
            storageBucket: "ping-b3ff7.firebasestorage.app",
            messagingSenderId: "234007505458",
            appId: "1:234007505458:web:ddf24a6e8d590d78db6a2b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const sidebarPanel = document.getElementById('sidebarPanel');
        const chatPanel = document.getElementById('chatPanel');
        const backToUsersBtn = document.getElementById('backToUsersBtn');

        const myAvatar = document.getElementById('myAvatar');
        const myName = document.getElementById('myName');
        const myUserHandle = document.getElementById('myUserHandle');
        const usersList = document.getElementById('usersList');
        const chatHeader = document.getElementById('chatHeader');
        const chatHeaderAvatarContainer = document.getElementById('chatHeaderAvatarContainer');
        const chatHeaderName = document.getElementById('chatHeaderName');
        const chatHeaderBio = document.getElementById('chatHeaderBio');
        const chatHeaderMenu = document.getElementById('chatHeaderMenu');
        const blockUserBtn = document.getElementById('blockUserBtn');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const inputContainer = document.getElementById('inputContainer');
        const imageInput = document.getElementById('imageInput');
        const uploadIcon = document.getElementById('uploadIcon');
        const viewOnceInput = document.getElementById('viewOnceInput');
        const recordAudioBtn = document.getElementById('recordAudioBtn');
        const recordIcon = document.getElementById('recordIcon');

        const profileModal = document.getElementById('profileModal');
        const openProfileBtn = document.getElementById('openProfileBtn');
        const closeProfileBtn = document.getElementById('closeProfileBtn');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const saveProfileBtnText = document.getElementById('saveProfileBtnText');
        const saveProfileSpinner = document.getElementById('saveProfileSpinner');
        const editDisplayName = document.getElementById('editDisplayName');
        const editUsername = document.getElementById('editUsername');
        const editBio = document.getElementById('editBio');
        const editAvatarPreview = document.getElementById('editAvatarPreview');
        const profileAvatarInput = document.getElementById('profileAvatarInput');
        const avatarUploadContainer = document.getElementById('avatarUploadContainer');

        const requestsModal = document.getElementById('requestsModal');
        const openRequestsBtn = document.getElementById('openRequestsBtn');
        const closeRequestsBtn = document.getElementById('closeRequestsBtn');
        const requestsListContainer = document.getElementById('requestsListContainer');
        const requestsBadge = document.getElementById('requestsBadge');

        const addUserModal = document.getElementById('addUserModal');
        const openAddUserModalBtn = document.getElementById('openAddUserModalBtn');
        const closeAddUserBtn = document.getElementById('closeAddUserBtn');
        const sendFriendRequestBtn = document.getElementById('sendFriendRequestBtn');
        const searchUsernameInput = document.getElementById('searchUsernameInput');
        const copyInviteBtn = document.getElementById('copyInviteBtn');

        const viewOnceModal = document.getElementById('viewOnceModal');
        const viewOnceImg = document.getElementById('viewOnceImg');
        const closeViewOnceBtn = document.getElementById('closeViewOnceBtn');

        let currentUser = null;
        let currentUserProfile = null;
        let selectedUser = null;
        let currentChatId = null;
        let secretEncryptionKey = null;
        let unsubscribeMessages = null;
        let tempAvatarURL = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let activeViewOnceMsgId = null;

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        function sendPushNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: body, icon: '/favicon.ico' });
            }
        }

        function encryptData(text, key) {
            if (!text) return "";
            return CryptoJS.AES.encrypt(text, key).toString();
        }

        function decryptData(ciphertext, key) {
            if (!ciphertext) return "";
            try {
                const bytes = CryptoJS.AES.decrypt(ciphertext, key);
                return bytes.toString(CryptoJS.enc.Utf8);
            } catch (e) {
                return "[رسالة مشفرة]";
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                let defaultUsername = user.email.split('@')[0].replace(/[^a-zA-Z0-9]/g, '');

                if (!userSnap.exists()) {
                    currentUserProfile = {
                        uid: user.uid,
                        name: user.displayName || "مستخدم Ping",
                        username: defaultUsername,
                        bio: "Ping Direct 🔒",
                        photoURL: user.photoURL || 'https://via.placeholder.com/40',
                        friends: [],
                        blocked: [],
                        lastSeen: serverTimestamp()
                    };
                    await setDoc(userRef, currentUserProfile);
                } else {
                    currentUserProfile = userSnap.data();
                    if (!currentUserProfile.friends) currentUserProfile.friends = [];
                    if (!currentUserProfile.blocked) currentUserProfile.blocked = [];
                }

                updateProfileUI();
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');

                listenToFriendRequests();
                loadFriendsList();
                checkInviteURL();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        function updateProfileUI() {
            myAvatar.src = currentUserProfile.photoURL || 'https://via.placeholder.com/40';
            editAvatarPreview.src = currentUserProfile.photoURL || 'https://via.placeholder.com/80';
            myName.textContent = currentUserProfile.name;
            myUserHandle.textContent = `@${currentUserProfile.username}`;

            editDisplayName.value = currentUserProfile.name || "";
            editUsername.value = currentUserProfile.username || "";
            editBio.value = currentUserProfile.bio || "";
            tempAvatarURL = currentUserProfile.photoURL;
        }

        loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
        logoutBtn.addEventListener('click', () => signOut(auth));

        backToUsersBtn.addEventListener('click', () => {
            chatPanel.classList.add('hidden');
            chatPanel.classList.remove('flex');
            sidebarPanel.classList.remove('hidden');
        });

        openProfileBtn.addEventListener('click', () => profileModal.classList.remove('hidden'));
        closeProfileBtn.addEventListener('click', () => profileModal.classList.add('hidden'));
        avatarUploadContainer.addEventListener('click', () => profileAvatarInput.click());

        profileAvatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            saveProfileBtnText.textContent = "جاري رفع الصورة...";
            saveProfileSpinner.classList.remove('hidden');

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) {
                    tempAvatarURL = result.data.url;
                    editAvatarPreview.src = tempAvatarURL;
                }
            } catch (error) {
                console.error(error);
            } finally {
                saveProfileBtnText.textContent = "تم";
                saveProfileSpinner.classList.add('hidden');
            }
        });

        saveProfileBtn.addEventListener('click', async () => {
            const newName = editDisplayName.value.trim();
            const newUsername = editUsername.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            const newBio = editBio.value.trim();

            if (!newName || !newUsername) return;

            currentUserProfile.name = newName;
            currentUserProfile.username = newUsername;
            currentUserProfile.bio = newBio;
            if (tempAvatarURL) currentUserProfile.photoURL = tempAvatarURL;

            await setDoc(doc(db, "users", currentUser.uid), currentUserProfile, { merge: true });
            updateProfileUI();
            profileModal.classList.add('hidden');
        });

        openRequestsBtn.addEventListener('click', () => requestsModal.classList.remove('hidden'));
        closeRequestsBtn.addEventListener('click', () => requestsModal.classList.add('hidden'));
        openAddUserModalBtn.addEventListener('click', () => addUserModal.classList.remove('hidden'));
        closeAddUserBtn.addEventListener('click', () => addUserModal.classList.add('hidden'));

        sendFriendRequestBtn.addEventListener('click', async () => {
            const targetHandle = searchUsernameInput.value.trim().toLowerCase().replace('@', '');
            if (!targetHandle) return;

            const q = query(collection(db, "users"), where("username", "==", targetHandle));
            const snap = await getDocs(q);

            if (snap.empty) {
                alert("لم يتم العثور على هذا المستخدم.");
                return;
            }

            let foundUser = null;
            snap.forEach(d => foundUser = d.data());

            if (foundUser.uid === currentUser.uid) {
                alert("لا يمكنك إرسال طلب لنفسك.");
                return;
            }

            await addDoc(collection(db, "requests"), {
                fromUid: currentUser.uid,
                fromName: currentUserProfile.name,
                fromUsername: currentUserProfile.username,
                fromPhoto: currentUserProfile.photoURL,
                toUid: foundUser.uid,
                status: "pending",
                timestamp: serverTimestamp()
            });

            addUserModal.classList.add('hidden');
            searchUsernameInput.value = '';
            alert("تم إرسال طلب المحادثة بنجاح!");
        });

        function listenToFriendRequests() {
            const q = query(collection(db, "requests"), where("toUid", "==", currentUser.uid), where("status", "==", "pending"));
            onSnapshot(q, (snapshot) => {
                requestsListContainer.innerHTML = '';
                if (snapshot.empty) {
                    requestsBadge.classList.add('hidden');
                    requestsListContainer.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">لا توجد طلبات جديدة</p>`;
                    return;
                }

                requestsBadge.textContent = snapshot.size;
                requestsBadge.classList.remove('hidden');

                snapshot.forEach((docSnap) => {
                    const req = docSnap.data();
                    const reqId = docSnap.id;

                    const item = document.createElement('div');
                    item.className = "p-3 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between";
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <img src="${req.fromPhoto}" class="w-10 h-10 rounded-full object-cover">
                            <div>
                                <h4 class="font-bold text-xs text-white">${req.fromName}</h4>
                                <p class="text-[10px] text-pink-400 font-mono">@${req.fromUsername}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="accept-btn bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">قبول</button>
                            <button class="reject-btn bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">رفض</button>
                        </div>
                    `;

                    item.querySelector('.accept-btn').addEventListener('click', async () => {
                        await updateDoc(doc(db, "requests", reqId), { status: "accepted" });
                        
                        await setDoc(doc(db, "users", currentUser.uid), {
                            friends: [...currentUserProfile.friends, req.fromUid]
                        }, { merge: true });

                        const otherRef = doc(db, "users", req.fromUid);
                        const otherSnap = await getDoc(otherRef);
                        if (otherSnap.exists()) {
                            const otherFriends = otherSnap.data().friends || [];
                            await setDoc(otherRef, { friends: [...otherFriends, currentUser.uid] }, { merge: true });
                        }

                        requestsModal.classList.add('hidden');
                    });

                    item.querySelector('.reject-btn').addEventListener('click', async () => {
                        await updateDoc(doc(db, "requests", reqId), { status: "rejected" });
                        setTimeout(async () => {
                            await deleteDoc(doc(db, "requests", reqId));
                        }, 1000);
                    });

                    requestsListContainer.appendChild(item);
                });
            });

            const rejectQuery = query(collection(db, "requests"), where("fromUid", "==", currentUser.uid), where("status", "==", "rejected"));
            onSnapshot(rejectQuery, (snapshot) => {
                snapshot.forEach(async (docSnap) => {
                    sendPushNotification("تم رفض الطلب", "قام المستخدم بطلب رفض المحادثة الخاصة.");
                    await deleteDoc(doc(db, "requests", docSnap.id));
                });
            });
        }

        copyInviteBtn.addEventListener('click', () => {
            const inviteURL = `${window.location.origin}/?user=${currentUserProfile.username}`;
            navigator.clipboard.writeText(inviteURL);
            alert(`تم نسخ رابط الدعوة المباشر:\n${inviteURL}`);
        });

        async function checkInviteURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUsername = urlParams.get('user');
            if (targetUsername) {
                const q = query(collection(db, "users"), where("username", "==", targetUsername.toLowerCase()));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    snap.forEach(d => {
                        const targetUser = d.data();
                        if (confirm(`هل تريد إرسال طلب محادثة إلى ${targetUser.name} (@${targetUser.username})؟`)) {
                            addDoc(collection(db, "requests"), {
                                fromUid: currentUser.uid,
                                fromName: currentUserProfile.name,
                                fromUsername: currentUserProfile.username,
                                fromPhoto: currentUserProfile.photoURL,
                                toUid: targetUser.uid,
                                status: "pending",
                                timestamp: serverTimestamp()
                            });
                        }
                    });
                }
            }
        }

        function loadFriendsList() {
            onSnapshot(doc(db, "users", currentUser.uid), async (userSnap) => {
                if (!userSnap.exists()) return;
                const myData = userSnap.data();
                currentUserProfile.friends = myData.friends || [];
                currentUserProfile.blocked = myData.blocked || [];

                usersList.innerHTML = '';
                
                if (currentUserProfile.friends.length === 0) {
                    usersList.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">لا توجد محادثات نشطة.<br>شارك رابط حسابك لبدء المحادثة!</p>`;
                    return;
                }

                for (let friendUid of currentUserProfile.friends) {
                    const friendDoc = await getDoc(doc(db, "users", friendUid));
                    if (friendDoc.exists()) {
                        const userData = friendDoc.data();
                        const userEl = document.createElement('div');
                        userEl.className = "p-3 rounded-2xl flex items-center gap-3 hover:bg-white/10 cursor-pointer transition border border-transparent my-1";
                        userEl.innerHTML = `
                            <div class="relative">
                                <img src="${userData.photoURL || 'https://via.placeholder.com/40'}" class="w-12 h-12 rounded-full object-cover p-0.5 bg-gradient-to-tr from-yellow-400 to-purple-600">
                                <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-black rounded-full"></span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-sm text-white truncate">${userData.name}</h3>
                                <p class="text-xs text-gray-400 font-mono truncate">@${userData.username}</p>
                            </div>
                        `;

                        userEl.addEventListener('click', () => openChat(userData));
                        usersList.appendChild(userEl);
                    }
                }
            });
        }

        function openChat(targetUser) {
            selectedUser = targetUser;
            inputContainer.classList.remove('hidden');
            chatHeaderMenu.classList.remove('hidden');

            if (window.innerWidth < 768) {
                sidebarPanel.classList.add('hidden');
            }
            chatPanel.classList.remove('hidden');
            chatPanel.classList.add('flex');
            
            currentChatId = [currentUser.uid, targetUser.uid].sort().join("_");
            secretEncryptionKey = `PingSecret_${currentChatId}_2026`;

            chatHeaderAvatarContainer.innerHTML = `<img src="${targetUser.photoURL || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover">`;
            chatHeaderName.textContent = targetUser.name;
            chatHeaderBio.textContent = `@${targetUser.username} • Ping Direct`;

            loadMessages();
        }

        blockUserBtn.addEventListener('click', async () => {
            if (!selectedUser) return;
            if (confirm(`حظر ${selectedUser.name}؟`)) {
                await setDoc(doc(db, "users", currentUser.uid), {
                    blocked: [...currentUserProfile.blocked, selectedUser.uid]
                }, { merge: true });
                alert("تم الحظر.");
                inputContainer.classList.add('hidden');
            }
        });

        recordAudioBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result;
                            const encryptedAudio = encryptData(base64Audio, secretEncryptionKey);
                            await sendMessage(null, encryptedAudio);
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordIcon.className = "fas fa-stop text-lg text-rose-500 animate-pulse";
                } catch (e) {
                    alert("تعذر الوصول إلى الميكروفون.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordIcon.className = "fas fa-microphone text-lg";
            }
        });

        async function sendMessage(encryptedImageUrl = null, encryptedAudioUrl = null, isViewOnce = false) {
            if (currentUserProfile.blocked.includes(selectedUser.uid)) {
                alert("المستخدم محظور.");
                return;
            }

            const text = messageInput.value.trim();
            if (!text && !encryptedImageUrl && !encryptedAudioUrl) return;

            messageInput.value = '';
            const encryptedText = text ? encryptData(text, secretEncryptionKey) : "";

            await addDoc(collection(db, "chats", currentChatId, "messages"), {
                senderUid: currentUser.uid,
                text: encryptedText,
                imageUrl: encryptedImageUrl || "",
                audioUrl: encryptedAudioUrl || "",
                isViewOnce: isViewOnce,
                viewed: false,
                deleted: false,
                timestamp: serverTimestamp()
            });
        }

        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatId) return;

            uploadIcon.className = "fas fa-spinner fa-spin text-lg text-blue-400";
            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) {
                    const encryptedUrl = encryptData(result.data.url, secretEncryptionKey);
                    await sendMessage(encryptedUrl, null, false);
                }
            } catch (error) {
                console.error(error);
            } finally {
                uploadIcon.className = "far fa-image text-lg";
                imageInput.value = '';
            }
        });

        viewOnceInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatId) return;

            const formData = new FormData();
            formData.append("image", file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
                const result = await response.json();
                if (result.success) {
                    const encryptedUrl = encryptData(result.data.url, secretEncryptionKey);
                    await sendMessage(encryptedUrl, null, true);
                }
            } catch (error) {
                console.error(error);
            } finally {
                viewOnceInput.value = '';
            }
        });

        window.saveImageToGallery = async (url) => {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `ping_ig_${Date.now()}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (e) {
                window.open(url, '_blank');
            }
        };

        closeViewOnceBtn.addEventListener('click', async () => {
            viewOnceModal.classList.add('hidden');
            if (activeViewOnceMsgId) {
                await updateDoc(doc(db, "chats", currentChatId, "messages", activeViewOnceMsgId), {
                    viewed: true,
                    imageUrl: "",
                    deleted: true
                });
                activeViewOnceMsgId = null;
            }
        });

        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(
                collection(db, "chats", currentChatId, "messages"),
                orderBy("timestamp", "asc")
            );

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const msgId = docSnap.id;
                    const isMine = msg.senderUid === currentUser.uid;

                    if (!isMine && snapshot.docChanges().some(c => c.type === "added")) {
                        sendPushNotification(selectedUser.name, "رسالة جديدة وصلت");
                    }

                    const containerWrapper = document.createElement('div');
                    containerWrapper.className = `flex w-full ${isMine ? 'justify-end' : 'justify-start'} message-pop group`;
                    
                    let content = '';

                    if (msg.deleted) {
                        content = `<p class="text-xs italic text-gray-400"><i class="fas fa-ban ml-1"></i> تم حذف هذه الرسالة</p>`;
                    } else if (msg.isViewOnce) {
                        if (msg.viewed) {
                            content = `<p class="text-xs italic text-pink-400/70 flex items-center gap-1"><i class="fas fa-eye-slash"></i> تم العرض</p>`;
                        } else {
                            content = `
                                <button class="view-once-trigger bg-pink-600/20 hover:bg-pink-600/30 text-pink-400 border border-pink-500/30 px-4 py-2 rounded-full text-xs font-bold transition flex items-center gap-2">
                                    <i class="fas fa-camera text-sm"></i> عرض الصورة
                                </button>
                            `;
                        }
                    } else {
                        const decryptedText = msg.text ? decryptData(msg.text, secretEncryptionKey) : "";
                        const decryptedImageUrl = msg.imageUrl ? decryptData(msg.imageUrl, secretEncryptionKey) : "";
                        const decryptedAudioUrl = msg.audioUrl ? decryptData(msg.audioUrl, secretEncryptionKey) : "";

                        if (decryptedImageUrl) {
                            content += `
                                <div class="relative group/img mb-1">
                                    <img src="${decryptedImageUrl}" class="rounded-2xl max-w-xs max-h-60 object-cover cursor-pointer hover:opacity-90 transition border border-white/10" onclick="window.open('${decryptedImageUrl}', '_blank')">
                                    <button onclick="saveImageToGallery('${decryptedImageUrl}')" class="absolute bottom-2 left-2 bg-black/80 text-white text-xs px-2.5 py-1.5 rounded-full border border-white/20 shadow-md flex items-center gap-1">
                                        <i class="fas fa-download"></i> حفظ
                                    </button>
                                </div>
                            `;
                        }
                        if (decryptedAudioUrl) {
                            content += `<audio controls class="w-60 mb-1"><source src="${decryptedAudioUrl}" type="audio/webm"></audio>`;
                        }
                        if (decryptedText) {
                            content += `<p class="text-sm leading-relaxed">${decryptedText}</p>`;
                        }
                    }

                    const bubble = document.createElement('div');
                    bubble.setAttribute('dir', 'rtl');
                    // لون فقاعات انستغرام المتدرج الوردي/البنفسجي
                    bubble.className = `${isMine ? 'bg-gradient-to-r from-purple-600 via-pink-600 to-rose-500 text-white rounded-3xl rounded-br-xs ml-auto' : 'bg-slate-800/90 text-gray-100 border border-white/10 rounded-3xl rounded-bl-xs mr-auto'} max-w-xs md:max-w-md p-3.5 shadow-md relative`;
                    bubble.innerHTML = content;

                    const viewOnceBtn = bubble.querySelector('.view-once-trigger');
                    if (viewOnceBtn) {
                        viewOnceBtn.addEventListener('click', () => {
                            const decryptedImageUrl = decryptData(msg.imageUrl, secretEncryptionKey);
                            viewOnceImg.src = decryptedImageUrl;
                            activeViewOnceMsgId = msgId;
                            viewOnceModal.classList.remove('hidden');
                        });
                    }

                    if (isMine && !msg.deleted) {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = "hidden group-hover:block absolute -top-2 -left-2 bg-rose-600 text-white w-6 h-6 rounded-full text-[10px] shadow-md transition";
                        deleteBtn.innerHTML = `<i class="fas fa-trash"></i>`;
                        deleteBtn.title = "حذف";
                        deleteBtn.addEventListener('click', async () => {
                            if (confirm("حذف الرسالة للجميع؟")) {
                                await updateDoc(doc(db, "chats", currentChatId, "messages", msgId), { deleted: true });
                            }
                        });
                        bubble.appendChild(deleteBtn);
                    }

                    containerWrapper.appendChild(bubble);
                    chatMessages.appendChild(containerWrapper);
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        sendBtn.addEventListener('click', () => sendMessage());
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
